# 블라인드 평가 스냅샷 파라미터 "범위" — scripts/generate_blind.py(Task S-22)가 --seed로
# 이 구간 안에서 random.Random(서브시드)를 결정적으로 뽑는다.
#
# scenario_config.yaml(표준, 20건 "값" 고정)과의 차이: 저 파일은 구체적인 값을 고정하지만
# 이 파일은 "값이 나올 수 있는 구간"만 정의한다 — 실행마다(--seed) 다른 조합이 결정적으로
# 뽑혀, 채점자가 표준 스냅샷의 파라미터를 암기해 블라인드 스냅샷을 "풀어버리는" 것을
# 막는다. 모든 구간은 표준값(scenario_config.yaml 실사용 값)을 포함하도록 잡았다.
#
# 격리 원칙은 scenario_config.yaml과 동일: medsupply/·app.py는 이 파일을 참조하지 않는다
# (scripts/datagen/·scripts/generate_blind.py·측정 스크립트만 읽는다).
version: 1

# ── 품목 배분 ────────────────────────────────────────────────────────────
# 표준(20건, 유형당 ≥4)과 달리 블라인드는 유형당 시나리오 정확히 1개 — 4유형 × 1 = 시나리오
# 품목 4개. 나머지는 전부 "정상" 품목이다(품절 신호 없음, 오탐률 측정의 대조군).
item_allocation:
  scenario_items_per_type: 1     # 고정값(변경 금지) — 4유형 × 1 = 시나리오 품목 4개.
  # 정상(비시나리오) 품목 수 허용 범위(가드레일, 뽑기 대상 아님). 블라인드 생성기는
  # 표준과 동일하게 카탈로그를 서브셋하지 않는다(data/reference/items_master.csv 전량을
  # baseline.generate_baseline·inject.inject_scenarios의 기존 reference_dir 매개변수로
  # 그대로 재사용 — action_history_seed.csv가 참조하는 8개 품목이 항상 카탈로그에 있어야
  # FK가 깨지지 않기 때문이다). 정상 품목 수 = 카탈로그 전체 - 4이며(현재 124개 기준 120),
  # 이 값이 여전히 타당한 범위인지(카탈로그 크기 변경을 조기 감지) 생성 시점에 검증하는
  # 가드레일로 이 range를 쓴다 — validate_scenario_config의 MAX_ITEM_RATIO(30%) 상한도
  # 이 범위의 하한(100)에서조차 4/100=4%로 여유 있게 만족한다.
  normal_item_count_range: {min: 100, max: 124}

# ── 측정 창(measurement window) — Task S-30c A: 배치 구간을 채점 규칙과 결합 ────
# S-30b가 실증한 1차 블라인드의 지배적 결함: 라벨 20건 중 12건이 스윕 시작 이전에 품절해
# 채점 규칙 `success = first_alert is not None and first_alert <= stockout_date`
# (scripts/measure_detection.py)를 **어떤 탐지기도 만족할 수 없었다**(그중 10건은 스윕 32일
# 내내 '위험' 등급이었는데도 미감지로 집계됐다). 원인은 "시나리오를 언제 배치하는가"와
# "언제 측정하는가"가 아무 제약으로도 묶여 있지 않았던 것이다.
#
# 이 절이 그 결합을 명시한다. 값은 base_date 기준 상대 오프셋(일)이라 --base-date가 바뀌어도
# 그대로 쓴다. 격리 원칙상 이 모듈은 medsupply/config를 읽을 수 없어 상수를 복제한다 —
# config/analytics_params.toml의 grade.watch_days가 바뀌면 watch_days도 같이 맞춰야 한다.
#
# 관측 가능 창 = [base_date + sweep_start_offset_days, base_date + sweep_end_offset_days
#                 + watch_days] = 표준 스윕 기준 [2026-07-01, 2026-08-31]
#   - 하한(스윕 시작): 스윕에서 나올 수 있는 가장 이른 first_alert가 스윕 첫날이므로 그
#     이전 품절은 감지 성공이 구조적으로 불가능하다(S-30b H1a).
#   - 상한(스윕 종료 + watch_days): 그 밖의 품절은 '주의'('watch_days 안에 소진 예상') 판정
#     근거 자체가 없다(S-30b H1b, measure_detection.horizon_end와 동일 정의).
# 생성기는 이 창을 inject_scenarios(observable_window=...)로 넘겨 라벨 전건이 창 안에
# 들어갈 때까지 재추첨한다(scripts/datagen/blind.py).
measurement_window:
  sweep_start_offset_days: -31   # 표준 스윕 시작 2026-07-01 (base_date 2026-08-01 기준)
  sweep_end_offset_days: 0       # 표준 스윕 종료 = base_date
  watch_days: 30                 # = config/analytics_params.toml grade.watch_days(복제 상수)

# ── 시나리오 개시일(앵커 날짜) 공통 구간 ───────────────────────────────────
# demand_surge.surge_start_date · supply_halt.halt_start_date · delivery_delay.expected_date
# 모두 이 구간에서 뽑는다(config.py의 ANCHOR_DATE_KEYS가 세 유형 모두 동일하게
# timeline_start~base_date 범위만 요구하므로 공통 구간으로 충분하다). base_date 기준 상대
# 오프셋(일, 음수=과거)으로 표현해 --base-date가 바뀌어도 그대로 쓸 수 있다.
#
# **Task S-30c A에서 -240~-30 → -52~-16으로 재정의했다.** 근거(전부 S-30b 실측):
#  1. 옛 구간(-240~-30)은 365일 타임라인 중 210일을 덮지만 실제로 측정되는 구간은 마지막
#     32일 + 오라클 지평 30일뿐이었다. onset→stockout 리드가 짧은 유형(supply_halt 13~46일,
#     composite 7~130일)은 높은 확률로 측정 창보다 몇 달 앞에서 끝나버렸고 — 관측 결과
#     10/10이 그랬다. 옛 구간에서 라벨 4건이 전부 창 안에 들어오는 조합은 12개 시드 중
#     1개(재추첨 17회 소요)뿐이었다.
#  2. 새 하한 -52는 표준 앵커 구간(SC-001~SC-020의 실사용 오프셋 -52~-6)의 하한과 같다 —
#     supply_halt가 미이행 발주를 만들 시간(재고가 재주문점 밑으로 내려갈 시간, 1주차 리뷰
#     F1)을 확보하면서도 품절이 스윕 이전에 끝나지 않는 구간이다. 실측: 20개 시드 전부
#     생성 성공(재추첨 평균 3.5회·최대 10회).
#  3. **새 상한 -16은 임의로 고른 값이 아니라 구조적 상한이다**: delivery_delay의
#     arrives_late arm은 expected_date + delay_days에 실제 도착 행을 만드는데, 그 날짜가
#     base_date를 넘으면 365일 타임라인 밖이라 재고에 credit되지 않아 inject.py가
#     "유령 입고(구현 오류)"로 **재시도 불가 에러**를 던진다. delay_days_range.max=15이므로
#     상한 + 15 <= 0, 즉 상한 <= -16이어야 한다. blind.py의 _validate_offset_ranges가 이
#     불변식을 생성 시점에 검사한다(범위를 나중에 넓힐 때 조용히 깨지지 않도록).
#  4. 구간이 좁아진 만큼 재추첨(max_generation_attempts) 의존도가 커진다 — 이는
#     "측정 가능한 배치만 남긴다"는 의도된 조건부 표집이지만, S-22가 고지한 재시도 낙관
#     편향을 키우는 방향이기도 하다(리포트에 반드시 병기할 것).
scenario_start_offset_days_range: {min: -52, max: -16}

demand_surge:
  ramp_days_range: {min: 7, max: 21}            # 표준 7~21일 폭과 동일
  peak_multiplier_range: {min: 1.4, max: 2.6}    # 표준 1.35~2.6 대부분 포함(하한 소폭 상향
  # — 임의 품목에서도 반사실 대비 사용량 차이가 뚜렷이 잡히도록 여유를 더 뒀다)
  sustain: true                                  # 표준 5건 전부 sustain=true, 블라인드도 고정

supply_halt:
  # 차단 길이(halt_start_date~expected_restart_date). expected_restart_date는
  # base_date 이후여도 무방하다(config.py의 앵커 날짜 범위 검사 대상이 아니다 — null=미정도
  # 표준처럼 허용).
  halt_duration_days_range: {min: 30, max: 90}
  indefinite_restart_probability: 0.3   # 이 확률로 expected_restart_date=null(표준 SC-007·
  # SC-008처럼 "미정" 케이스도 뽑히게 한다).
  demand_shift_multiplier_range: {min: 1.1, max: 1.5}   # 표준 SC-006·SC-009·SC-018과 동일 폭
  demand_shift_probability: 0.6   # 이 확률로만 demand_shift_multiplier를 params에 포함한다
  # (표준도 5건 중 3건만 이 선택 키를 쓴다 — REQUIRED_PARAM_KEYS에는 없는 선택 항목).

delivery_delay:
  delay_days_range: {min: 4, max: 15}     # 표준 4~15일과 동일 폭(receipt_delay_days 임계
  # 3일보다 항상 크게 — medsupply/analytics/anomaly.py detect_receipt_delay 감지 대상권)
  qty_ratio_range: {min: 0.7, max: 1.0}   # 표준 0.7~1.0과 동일 폭
  # 지연 '도착' arm(Task S-22 핵심 요건) — 이 확률로 실제 도착(release_day=expected_date+
  # delay_days에 actual_date가 기록되어 expected_date < actual_date)이 발생한다. 나머지
  # 확률은 표준과 동일하게 "영구 미이행"(actual_date NULL)으로 남는다. 2주차 리뷰 F6
  # 이월 요건: 표준 스냅샷은 이 arm이 0건이라 receipt_delay의 as_of 기준 재구성(S-17d,
  # medsupply/analytics/asof.py)을 실데이터로 검증한 적이 없다 — 이 확률을 0보다 크게
  # 유지해야 그 공백이 메워진다(0.5 = 매 실행 절반 확률로 도착 arm 관측 가능, 여러 시드에
  # 걸쳐 최소 1건은 뜨도록 넉넉히 잡음).
  arrives_late_probability: 0.5

# ── compound(=composite) 조합 규칙 ──────────────────────────────────────
# sub_scenarios 2개를 표준 config가 실제로 검증한 두 조합 중 하나로만 구성한다(SC-016·017·
# 019=demand_surge+supply_halt, SC-018·020=supply_halt+delivery_delay). 각 하위 요소는 위
# 유형별 구간에서 독립적으로 뽑되, delivery_delay 하위 요소는 arrives_late를 뽑지 않는다
# (halt와 동시에 같은 발주를 겨냥할 때의 상호작용을 구현 범위 밖으로 명시적으로 뺐다 —
# standalone delivery_delay 유형에서만 지연 도착 arm을 뽑는다. 요건 충족에는 지장 없다:
# "생성 가능해야 한다"는 조건은 조합이 아니라 4유형 중 1개만 만족해도 된다).
compound:
  allowed_pairs:
    - [demand_surge, supply_halt]
    - [supply_halt, delivery_delay]

# ── 정상 품목 미끼(decoys) — 컨트롤러 리뷰 F1(픽스 라운드 1, M-30 전 필수) ────────────
# 결함: "actual_date>expected_date OR (actual_date IS NULL AND expected_date<base_date)"
# 같은 단순 SQL 하나가 시나리오 품목 4개를 오탐 0으로 완전히 역산해낸다 — 정상 품목은
# 입고 지연·연체 신호를 원천적으로 하나도 안 갖기 때문이다(baseline 궤적은 전부 제때
# 도착). 블라인드 평가는 "데이터 패턴에서 위험을 찾아내는지"를 테스트해야지 "어느 품목이
# 시나리오 품목인지 SQL 한 줄로 새는지"를 테스트하면 안 된다. 표준 경로(scenario_config.yaml
# 기반 20건 생성)는 이 절의 영향을 받지 않는다 — 미끼는 blind.py의 생성 후처리 단계에서만
# 주입된다.
decoys:
  # 미끼 앵커 날짜(expected_date) 공통 구간 — base_date 기준 상대 오프셋(일, 음수=과거).
  # scenario_start_offset_days_range보다 base_date에 더 가깝게 잡아 "최근 발주" 느낌을
  # 유지한다.
  target_offset_days_range: {min: -60, max: -10}

  # ── 적격성 가드(Task S-30c A에서 재정의, 미끼 2종 공통) ──────────────────────
  # **옛 가드는 거짓이었다.** 옛 규칙은 미끼 2에만 적용됐고 base_date **한 점**의
  # closing_stock/평균사용량 > 44("watch_days 30 + 마진 14")를 봤다. 그런데 채점은 스윕
  # 32일을 **매일** 평가하고 최저치가 등급을 결정하며, 이 시뮬레이터에서 base_date는 대체로
  # 재발주 직후 고점이다(S-30b 실측: ITM-0002 base_date 재고 1748 vs 스윕 저점 301).
  # 결과: 미끼 2를 받은 39건 중 **37건(94.9%)이 '주의'를 넘었고 36건이 '경고' 이상**까지
  # 갔다 — 1차 블라인드 오탐 상승 +10.31%p 중 +6.17%p(정확 반사실 실험으로 확정)가 여기서
  # 나왔다. 미끼 1도 "등급 불변"을 주장했지만 거짓이었다(아래 미끼 1 주석 참조).
  #
  # 새 규칙(두 미끼 공통): **스윕 구간 최저 커버리지** = 창 내 min(closing_stock) /
  # 평균 사용량(전체 구간) > min_sweep_coverage_days. 창은 measurement_window의
  # [스윕 시작, 스윕 종료]다 — 오탐은 스윕 매일 판정 중 한 번이라도 '주의' 이상이면
  # 성립하므로 저점이 기준이어야 한다. overdue_cutoff(연체가 1건이라도 있으면 그 품목의
  # 미래 예정 입고를 전부 미반영하는 보수 전환, medsupply/analytics/depletion.py)가 걸려도
  # '주의' 미진입이 보장되는 품목에만 미끼를 준다는 원래 의도를 실제로 만족하는 정의다.
  #
  # **알려진 결과(정직 고지)**: 현재 카탈로그·베이스라인 리듬에서는 정상 품목의 스윕 저점
  # 커버리지가 대체로 8~10일(S-30b §2.5)이라 이 기준(44일)을 넘는 품목이 **사실상 0건**
  # 이다. 즉 이 가드 아래에서는 미끼가 거의/전혀 주입되지 않는다. 그건 상수를 잘못 골라서가
  # 아니라 "cutoff가 걸려도 안전한 정상 품목"이 이 데이터에 존재하지 않는다는 사실의
  # 반영이다(무임계 overdue_cutoff라는 실재하는 탐지기 취약점 — S-30b §4.3, 이번 범위 밖).
  # 부작용: S-22 F1(단순 SQL 한 줄로 시나리오 품목을 역산하는 누출)에 대한 방어가 그만큼
  # 약해진다. 그 대가로 오탐률이 표준 스냅샷과 like-for-like로 비교 가능해진다.
  # 강제 주입은 금지다 — 적격 품목이 부족하면 넣을 수 있는 만큼만 넣는다.
  min_sweep_coverage_days: 44   # = watch_days(30) + 14일 마진(복제 상수)

  # 미끼 1: 경미한 지연 도착 — receipt_delay_days(3, config/analytics_params.toml) 미만이라
  # anomaly.detect_receipt_delay는 신호를 내지 않는다. **다만 "이상신호·등급·점수 불변"이라던
  # 옛 주석은 거짓이었다**(S-30b §2.4): `depletion.overdue_cutoff`에는 일수 임계가 없어
  # 예정일과 실도착일 사이 1~2일 동안 그 품목의 미래 예정 입고가 전부 미반영되고, 오탐은
  # 32일 중 한 번만 울려도 성립한다 — 지연 창이 스윕과 겹친 미끼 35건 중 17건(48.6%)이
  # 경보일이 컷오프 발동일에만 존재했다(1건은 곧장 '위험'). 그래서 이제 미끼 1도 위
  # 적격성 가드를 통과한 품목에만 준다. 자연 발주 매칭 여부(natural/forced)는
  # inject._resolve_effects가 기존 규칙 그대로 결정한다(±7일 밖이면 강제 생성 arm으로 자동
  # 분기 — 미끼 전용 특별 취급 없음).
  minor_delay_ratio_range: {min: 0.05, max: 0.15}
  minor_delay_days_choices: [1, 2]

  # 미끼 2: 안전 연체(적격 정상 품목 전용) — 발주 1건을 영구 미이행(actual_date NULL)
  # 상태로 추가해 "연체" 시그니처를 만들되, 재고 궤적(stock_usage_daily)에는 손대지
  # 않는다(day-loop 상태기계 밖의 합성 행 — inject._item_reorder_profile로 reorder_qty·
  # lead_time만 조회해 직접 구성).
  safe_overdue_target_ratio: 0.10   # 목표 비율(적격 품목이 부족하면 있는 만큼만, 강제 금지)

  # ── 비교 가능성 고지(S-30b §2.6·§5(b)4) ─────────────────────────────────────
  # 미끼가 1건이라도 주입되면 블라인드 대조군(정상 품목)의 난이도가 표준 스냅샷 대조군과
  # 비대칭이 된다 — 표준 정상 104건은 입고 이상 0건인 반면 1차 블라인드 정상 600슬롯은
  # 109건(18.2%)이 주입된 입고 이상을 지녔다. 그런 회차의 오탐률은 표준과 **직접 비교할 수
  # 없다**. 리포트에 반드시 병기할 것.

# ── 생성기 안정성 가드 ──────────────────────────────────────────────────
# 위 구간에서 뽑은 (품목, 파라미터) 조합이 우연히 물리적으로 무효과(예: 임의 품목의 재고
# 리듬상 halt 기간 중 재주문점 밑으로 안 내려감 — inject.py의 _assert_effects_effective가
# 명확한 에러로 잡는다)일 수 있다. 표준 config는 품목별로 사람이 강도를 미세조정했지만
# (1주차 리뷰 F1), 블라인드는 임의 품목이라 그럴 수 없다 — 대신 실패 시 서로 다른
# 서브시드 네임스페이스("attempt{N}")로 전량 재추첨해 재시도한다(seed 자체는 그대로라
# 최종 결과는 여전히 그 seed에 대해 결정적이다). 이 상한을 넘겨도 실패하면 명확한
# 에러로 중단한다(조용한 폴백 없음).
#
# Task S-30c A에서 20 → 40으로 올렸다. 재추첨 사유가 하나 늘었기 때문이다(무효과에 더해
# "품절일이 측정 창 밖"). 실측(20개 시드, 새 onset 구간): 재추첨 평균 3.5회·중앙 2.5회·
# 최대 10회로 20회 안에 전부 성공하지만, 4건의 라벨이 **동시에** 창 안에 들어야 하는
# 결합 조건이라 꼬리가 길어 여유를 둔다. 이 상향은 S-22가 고지한 재시도 낙관 편향을
# 키우는 방향이므로 결과 리포트에 반드시 병기한다.
max_generation_attempts: 40
