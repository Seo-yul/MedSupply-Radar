# 평가 루브릭 v1 — judge 실행 설정. 실행기 자체(eval/judge.py)는 Task S-27 몫이며 이 설정을
# 소비하기만 한다(이 태스크에서는 만들지 않는다).
rubric_version: v1
prompt_version: judge_v1
temperature: 0

# 교차 judge 규칙(바인딩 결정 — 어길 수 없음): judge는 "생성 provider" 기준으로 동적 교차된다.
# 생성이 anthropic이면 judge는 OpenAI 고정 스냅샷, 생성이 openai면 judge는 Anthropic 고정
# 스냅샷을 쓴다(같은 공급자가 자기 생성물을 채점하지 않는다).
#
# temperature 0·모델 스냅샷 고정이 원칙이나(별칭 금지 — 예: gpt-5.2-2026-xx 형식), 이 설정을
# 작성한 시점(2026-08-21)에는 두 공급자 모두 확정된 날짜 스냅샷 ID를 조회할 수 없었다(API 키
# 미보유 환경 — task-S18-brief.md에서 별칭+TODO 기입을 명시적으로 허용). 아래 model 값은
# .env.example의 기본 별칭을 임시로 넣어 둔 것이며, 스냅샷 ID가 확정되면 TODO를 지우고
# 교체해야 한다.
judge_by_generation_provider:
  anthropic: {provider: openai, model: gpt-5}  # TODO(S-27 착수 전 확정): gpt-5.2-2026-xx 형식의 고정 스냅샷 ID로 교체. 별칭(gpt-5) 임시 사용.
  openai: {provider: anthropic, model: claude-opus-5}  # TODO(S-27 착수 전 확정): claude-opus-5-<날짜> 형식의 고정 스냅샷 ID로 교체. 별칭(claude-opus-5) 임시 사용.

# S-26(40케이스 평가 데이터셋 구성)에서 채운다. 지금은 자리만 잡아 둔다.
dataset:
  cases: 40
  pilot: 4
  content_hash: null
