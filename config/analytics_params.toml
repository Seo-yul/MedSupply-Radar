# 분석 파라미터 단일 소스 — 위험 판정 로직은 이 파일의 값만 사용한다 (schema v1)
[grade]
danger_days = 7          # 소진 예상 ≤7일 → 위험
warning_days = 14        # ≤14일 → 경고
watch_days = 30          # ≤30일 → 주의
escalate_on_notice = true        # 활성 공고 매핑 시 1단계 상향(위험 캡)
escalate_needs_review = true     # '확인 필요' 매핑도 상향에 포함

[forecast]
method = "ses"           # 'sma' | 'ses' — 채택 모델. sma는 베이스라인 비교용으로 항상 병산
sma_window = 28
ses_alpha = 0.3
horizon_days = 14

[anomaly]
surge_ratio = 0.30       # 최근 recent_window 평균이 기준 창 대비 +30% 이상 → usage_surge
drop_ratio = 0.30        # -30% 이하 → usage_drop
recent_window = 7
baseline_window = 28     # recent_window 직전 구간
receipt_delay_days = 3   # 예정일 대비 지연 임계(초과 시 receipt_delay)

[depletion]
reflect_receipts = false # 입고예정 반영 기본 미반영(보수적)

[score]
# 0~100 점수 = 등급 구간 기본점 + 요인 가점(상한 100)
base_danger = 70
base_warning = 45
base_watch = 20
base_normal = 0
per_anomaly = 8          # 이상신호 1건당 가점
notice_bonus = 15        # 활성 공고 매핑 가점
